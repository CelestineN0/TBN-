<title>My Social Links</title>

<style>
  :root { --bg:#12aaf7; --text:#0b2a3d; --muted:#000; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; min-height:100svh; background:linear-gradient(to bottom,#B8FB3C,#03045E) no-repeat fixed; font-family:Poppins,system-ui,sans-serif;
         display:flex; justify-content:center; align-items:center; padding:32px 16px; }
  main { width:100%; max-width:360px; text-align:center; }
  .avatar { width:140px; height:140px; border-radius:50%; background:#000; margin:0 auto 14px; position:relative; overflow:hidden; }
  .avatar img { position:absolute; width:271px; max-width:none; left:-38px; top:-27px; }
  h1 { font-size:18px; font-weight:500; margin:0; color:var(--text); }
  p.tag { font-size:13px; margin:4px 0 56px; color:var(--muted); }
  a.link { display:flex; align-items:center; gap:14px; height:57px; margin-bottom:9px; padding:0 18px;
           border-radius:6px; color:#fff; text-decoration:none; font-size:13px; font-weight:500;
           transition:transform .15s, filter .15s; }
  a.link:hover { transform:translateY(-2px); filter:brightness(1.08); }
  a.link svg { width:28px; height:28px; fill:#fff; flex:none; }
  .facebook { background:#3b5998; } .instagram { background:#e4405f; }
  .x { background:#000; } .linkedin { background:#0077b5; }
  .youtube { background:#e62117; } .tiktok { background:#111; } .whatsapp { background:#25d366; }

  /* Splash screen shown while the page loads */
  #splash { position:fixed; inset:0; z-index:9999; background:#000; display:flex; align-items:center; justify-content:center;
            transition:opacity .5s ease, visibility .5s ease; }
  #splash.hide { opacity:0; visibility:hidden; }
  #splash .logo { width:200px; height:200px; border-radius:50%; position:relative; overflow:hidden; background:#000;
                  animation:pulse 1.4s ease-in-out infinite; }
  #splash .logo img { position:absolute; width:387px; max-width:none; left:-54px; top:-39px; }
  @keyframes pulse { 0%,100% { transform:scale(1); opacity:.85; } 50% { transform:scale(1.06); opacity:1; } }
</style>
</head>
<body>
<div id="splash"><div class="logo"><img src="profile.jpg" alt=""></div></div>
<noscript><style>#splash{display:none}</style></noscript>

  // ==================================
  // Splash: show at least 1.5s, hide once the page has loaded (fallback after 5s)
  (function () {
    const splash = document.getElementById("splash"), start = Date.now();
    let done = false;
    const hide = () => { if (done) return; done = true; splash.classList.add("hide"); setTimeout(() => splash.remove(), 600); };
    window.addEventListener("load", () => setTimeout(hide, Math.max(0, 1500 - (Date.now() - start))));
    setTimeout(hide, 5000);
  })();

  document.getElementById("links").innerHTML = links.map(l =>
    `<a class="link ${l.cls}" href="${l.url}" target="_blank" rel="noopener">
       <svg viewBox="0 0 24 24"><path d="${l.icon}"/></svg><span>${l.text}</span></a>`).join("");
</script>
